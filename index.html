<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a.lazyflower 一朵懶懶花🌸</title>
    <meta name="description" content="一朵懶懶花的台中美食與生活食記地圖：小鳥胃・螞蟻人・挑食鬼的主觀紀錄。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script type="module" src="js/app.js"></script>

    <!-- GoatCounter 訪客統計 -->
    <script data-goatcounter="https://lazyflower.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body data-view="list">

<div id="sticky-bar" class="sticky-bar">
    <header class="site-header">
        <a class="brand" href="./" aria-label="回到首頁">
            <span class="brand-mark" aria-hidden="true">🌸</span>
            <span class="brand-text">
                <strong>一朵懶懶花</strong>
                <small>a.lazyflower・台中｜美食｜生活</small>
            </span>
        </a>

        <label class="search" for="search-input">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="search-input" placeholder="搜尋店名、區域、品項…例如「清水 牛肉麵」" autocomplete="off">
            <button type="button" id="search-clear" class="search-clear" aria-label="清除搜尋" hidden>✕</button>
        </label>

        <nav class="header-links" aria-label="社群連結">
            <a class="btn btn-ig" href="https://www.instagram.com/a.lazyflower/" target="_blank" rel="noopener">Instagram</a>
            <a class="btn btn-ghost" href="https://www.threads.com/@a.lazyflower" target="_blank" rel="noopener">Threads</a>
        </nav>
    </header>

    <div class="toolbar">
        <div id="region-chips" class="chips" role="tablist" aria-label="地區篩選"></div>
        <div class="toolbar-right">
            <span id="result-count" class="result-count" aria-live="polite"></span>
            <select id="sort-select" class="select" aria-label="排序">
                <option value="newest">最新優先</option>
                <option value="oldest">最舊優先</option>
            </select>
        </div>
    </div>
</div>

<section class="hero" aria-label="關於我">
    <div class="hero-intro">
        <p class="hero-hello">👋 嗨！我是一朵懶懶花</p>
        <p class="hero-bio">喜愛發掘生活中的美好🙋‍♀️ 小鳥胃・螞蟻人・挑食鬼👻 食記主觀紀錄😉<br>
            <span class="muted">📮 互惠／合作邀約歡迎私訊・⚠️ 未經同意勿轉載圖文</span></p>
    </div>
    <dl class="hero-stats">
        <div><dt>篇食記</dt><dd id="stat-posts">0</dd></div>
        <div><dt>個地區</dt><dd id="stat-regions">0</dd></div>
        <div><dt>次瀏覽</dt><dd id="stat-visits">…</dd></div>
    </dl>
</section>

<main class="layout">
    <section class="list-pane" aria-label="食記列表">
        <div id="post-grid" class="post-grid"></div>
        <div id="empty-state" class="empty-state" hidden>
            <p class="empty-emoji">🥲</p>
            <p class="empty-title">找不到「<span id="empty-query"></span>」相關的食記</p>
            <p class="muted">換個關鍵字試試，或看看其他地區</p>
            <button type="button" id="reset-filters" class="btn btn-primary">清除篩選</button>
        </div>
    </section>

    <aside class="map-pane" aria-label="食記地圖">
        <div id="map" class="map"></div>
    </aside>
</main>

<button type="button" id="view-toggle" class="view-toggle" aria-pressed="false">
    <span class="view-toggle-icon" aria-hidden="true">🗺️</span><span class="view-toggle-label">地圖</span>
</button>

<button type="button" id="back-to-top" class="back-to-top" aria-label="回到頂部">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div id="detail-drawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop"></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <button type="button" class="drawer-close" aria-label="關閉">✕</button>
        <div class="drawer-body"></div>
    </div>
</div>

<footer class="site-footer">
    <p>Copyright © 2025 a.lazyflower 一朵懶懶花🌸. All rights reserved.</p>
</footer>

</body>
</html>
